[project]
name = "pillcare-backend"
version = "0.2.0"
description = "PillCare REST + WebSocket API (FastAPI + Supabase Postgres)"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "pydantic-settings",
    "pyjwt[crypto]",
    "python-dotenv>=1.2.3",
    # zoneinfo needs an IANA database; Windows has none built in.
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx",
    "websockets",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
